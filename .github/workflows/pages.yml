name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app lives at https://timea-ve.github.io/ui-workflow-editor/. The build also writes dist/404.html
      # (a copy of index.html) so deep links like /ui-workflow-editor/b/<id> load the app.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /ui-workflow-editor/
          # "Save to GitHub" (docs/GITHUB-SAVE.md). Public values, kept as repository *variables*
          # (Settings → Secrets and variables → Actions → Variables). If any is empty the feature stays hidden.
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.VITE_GITHUB_APP_SLUG }}
          VITE_AUTH_WORKER_URL: ${{ vars.VITE_AUTH_WORKER_URL }}

      - name: Check SPA fallback
        run: test -f dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
